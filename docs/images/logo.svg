<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Accent Gradients -->
    <linearGradient id="hexBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="heliBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#FF3838" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0" />
    </radialGradient>
    <!-- Soft Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Tactical Background & Glow -->
  <circle cx="100" cy="100" r="94" fill="#070C18" fill-opacity="0.75" />
  <circle cx="100" cy="100" r="70" fill="url(#centerGlow)" />
  <circle cx="100" cy="100" r="90" fill="url(#beaconGlow)" />

  <!-- Tactical Radar Rings -->
  <g stroke="#38BDF8" stroke-width="1.4" opacity="0.45">
    <circle cx="100" cy="100" r="88" stroke-dasharray="6 4.5" />
    <circle cx="100" cy="100" r="64" stroke-dasharray="2 3" opacity="0.35" />
    <line x1="100" y1="8" x2="100" y2="192" stroke-dasharray="3 3" opacity="0.4" />
    <line x1="8" y1="100" x2="192" y2="100" stroke-dasharray="3 3" opacity="0.4" />
  </g>

  <!-- Hexagonal Tactical Badge Frame -->
  <polygon points="100,24 165,62 165,138 100,176 35,138 35,62" 
           fill="#0B132B" 
           stroke="url(#hexBorder)" 
           stroke-width="3" />

  <!-- Inner Hexagon Accent Line -->
  <polygon points="100,32 157,66 157,134 100,168 43,134 43,66" 
           fill="none" 
           stroke="#0284C7" 
           stroke-width="1" 
           opacity="0.5" 
           stroke-dasharray="4 3" />

  <!-- Stylized Rescue Helicopter / Drone Icon -->
  <g transform="translate(62, 62)">
    <!-- Main Rotor Assembly -->
    <path d="M6 14 Q38 11 70 14 Q38 17 6 14 Z" fill="#38BDF8" filter="url(#softGlow)" />
    <ellipse cx="38" cy="14" rx="4" ry="2.5" fill="#E0F2FE" />
    <rect x="36" y="14" width="4" height="10" fill="#94A3B8" rx="1" />

    <!-- Fuselage Body -->
    <path d="M20 28 C20 23 26 21 42 21 C58 21 64 24 64 34 C64 44 56 49 42 49 C28 49 20 42 20 28 Z" fill="url(#heliBody)" />

    <!-- Cockpit Canopy Glass -->
    <path d="M44 24 C54 24 61 27 61 33 C61 38 56 42 46 42 C40 42 40 24 44 24 Z" fill="#E0F2FE" opacity="0.9" />
    <path d="M47 26 C53 26 58 28 58 32 C58 34 55 36 49 36 Z" fill="#38BDF8" opacity="0.65" />

    <!-- Tail Boom and Tail Rotor -->
    <path d="M22 31 L2 35 L2 38 L22 36 Z" fill="#CBD5E1" />
    <polygon points="2,29 5,29 5,43 2,43" fill="#EA580C" />
    <line x1="3.5" y1="26" x2="3.5" y2="46" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" />

    <!-- Landing Skids -->
    <rect x="28" y="49" width="3.5" height="7" fill="#64748B" />
    <rect x="46" y="49" width="3.5" height="7" fill="#64748B" />
    <rect x="18" y="56" width="44" height="3" rx="1.5" fill="#E2E8F0" />
    <path d="M62 56 Q66 56 67 52" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Emergency Medical / Rescue Cross Mark -->
    <g transform="translate(29, 31)">
      <rect x="4" y="0" width="3.5" height="11" fill="#FFFFFF" rx="0.8" />
      <rect x="0" y="3.8" width="11.5" height="3.5" fill="#FFFFFF" rx="0.8" />
    </g>

    <!-- Signal Beacons -->
    <circle cx="62" cy="35" r="2.2" fill="#22D3EE" filter="url(#softGlow)" />
    <circle cx="2" cy="27" r="1.8" fill="#EF4444" filter="url(#softGlow)" />
  </g>
</svg>
