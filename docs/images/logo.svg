<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#F97316" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#FF3838" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <!-- Filter for drop shadow / glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="836" height="216" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Subtle Tactical Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#94A3B8" stroke-width="1">
    <line x1="30" y1="40" x2="810" y2="40" stroke-dasharray="4 8" />
    <line x1="30" y1="80" x2="810" y2="80" stroke-dasharray="4 8" />
    <line x1="30" y1="120" x2="810" y2="120" stroke-dasharray="4 8" />
    <line x1="30" y1="160" x2="810" y2="160" stroke-dasharray="4 8" />
    <line x1="180" y1="20" x2="180" y2="200" stroke-dasharray="4 8" />
    <line x1="340" y1="20" x2="340" y2="200" stroke-dasharray="4 8" />
    <line x1="500" y1="20" x2="500" y2="200" stroke-dasharray="4 8" />
    <line x1="660" y1="20" x2="660" y2="200" stroke-dasharray="4 8" />
  </g>

  <!-- Left Icon Glow -->
  <circle cx="106" cy="110" r="85" fill="url(#glowPulse)" />
  <circle cx="106" cy="110" r="50" fill="url(#cyanGlow)" />

  <!-- Tactical Radar Rings -->
  <g stroke="#38BDF8" stroke-width="1.2" opacity="0.35">
    <circle cx="106" cy="110" r="66" stroke-dasharray="6 4" />
    <circle cx="106" cy="110" r="48" />
    <line x1="106" y1="36" x2="106" y2="184" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="32" y1="110" x2="180" y2="110" stroke-dasharray="3 3" opacity="0.5" />
  </g>

  <!-- Hexagonal Tactical Badge Frame -->
  <polygon points="106,44 162,76 162,144 106,176 50,144 50,76" fill="#0B132B" stroke="#0284C7" stroke-width="2.5" opacity="0.9" />

  <!-- Stylized Helicopter / Drone Vector Icon -->
  <g transform="translate(68, 72)">
    <!-- Main Rotor Blades -->
    <path d="M6 14 Q38 12 70 14 Q38 16 6 14 Z" fill="#38BDF8" filter="url(#softGlow)" />
    <ellipse cx="38" cy="14" rx="4" ry="2.5" fill="#E0F2FE" />
    <rect x="36" y="14" width="4" height="10" fill="#94A3B8" rx="1" />

    <!-- Helicopter Body Fuselage -->
    <path d="M20 28 C20 23 26 21 42 21 C58 21 64 24 64 34 C64 44 56 49 42 49 C28 49 20 42 20 28 Z" fill="url(#accentOrange)" />

    <!-- Cockpit Canopy Glass -->
    <path d="M44 24 C54 24 61 27 61 33 C61 38 56 42 46 42 C40 42 40 24 44 24 Z" fill="#E0F2FE" opacity="0.85" />
    <path d="M47 26 C53 26 58 28 58 32 C58 34 55 36 49 36 Z" fill="#38BDF8" opacity="0.6" />

    <!-- Tail Boom and Tail Rotor -->
    <path d="M22 31 L2 35 L2 38 L22 36 Z" fill="#CBD5E1" />
    <polygon points="2,29 5,29 5,43 2,43" fill="#EA580C" />
    <line x1="3.5" y1="26" x2="3.5" y2="46" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />

    <!-- Landing Skids -->
    <rect x="28" y="49" width="3" height="7" fill="#64748B" />
    <rect x="46" y="49" width="3" height="7" fill="#64748B" />
    <rect x="18" y="56" width="42" height="3" rx="1.5" fill="#E2E8F0" />
    <path d="M60 56 Q64 56 65 52" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Medical/Rescue Cross Mark on Cabin -->
    <g transform="translate(29, 31)">
      <rect x="4" y="0" width="3.5" height="11" fill="#FFFFFF" rx="0.8" />
      <rect x="0" y="3.8" width="11.5" height="3.5" fill="#FFFFFF" rx="0.8" />
    </g>

    <!-- Signal Beacons -->
    <circle cx="62" cy="35" r="2.2" fill="#22D3EE" filter="url(#softGlow)" />
    <circle cx="2" cy="27" r="1.8" fill="#EF4444" filter="url(#softGlow)" />
  </g>

  <!-- Text Branding Block -->
  <g transform="translate(205, 30)">
    <!-- Top Status / Mode Tag -->
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="220" height="24" rx="12" fill="#1E293B" stroke="#0284C7" stroke-width="1.2" />
      <circle cx="12" cy="12" r="4.5" fill="#10B981" />
      <circle cx="12" cy="12" r="7" stroke="#10B981" stroke-width="1.5" opacity="0.6" />
      <text x="24" y="16" font-family="'Space Mono', 'Roboto Mono', 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.2">SYSTEM OPERATIONAL</text>
      <text x="176" y="16" font-family="'Space Mono', 'Roboto Mono', monospace" font-size="10" font-weight="700" fill="#F59E0B">V1.0</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 68)">
      <!-- Helicopter Emoji / Icon Graphic -->
      <text x="0" y="0" font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif" font-size="46" fill="#FFFFFF">🚁</text>
      <!-- Title Typography -->
      <text x="60" y="-2" font-family="'Inter', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
        Swarm<tspan fill="#FF5722">-</tspan><tspan fill="#FF5722">ResQ</tspan>
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(4, 98)">
      <text x="0" y="0" font-family="'Space Mono', 'Roboto Mono', 'Segoe UI', monospace" font-size="14.5" font-weight="700" fill="#38BDF8" letter-spacing="2.8">
        MULTI-AGENT AUTONOMOUS RESCUE SWARM
      </text>
    </g>

    <!-- Architecture & Capability Badges -->
    <g transform="translate(4, 126)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="102" height="22" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="8" y="15" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.5">LANGCHAIN</text>
      
      <!-- Chip 2 -->
      <rect x="110" y="0" width="86" height="22" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="118" y="15" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.5">FASTMCP</text>

      <!-- Chip 3 -->
      <rect x="204" y="0" width="128" height="22" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="212" y="15" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.5">OLLAMA / CLOUD</text>

      <!-- Chip 4 -->
      <rect x="340" y="0" width="118" height="22" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="348" y="15" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.5">STREAMLIT UI</text>

      <!-- Chip 5 -->
      <rect x="466" y="0" width="138" height="22" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="474" y="15" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="0.5">COLLISION GUARD</text>
    </g>
  </g>

  <!-- Right Decorative Telemetry Bracket -->
  <g transform="translate(806, 30)" stroke="#38BDF8" stroke-width="2" opacity="0.6" fill="none">
    <path d="M0 0 L14 0 L14 14" />
    <path d="M0 160 L14 160 L14 146" />
  </g>
  <g transform="translate(24, 30)" stroke="#F97316" stroke-width="2" opacity="0.6" fill="none">
    <path d="M14 0 L0 0 L0 14" />
    <path d="M14 160 L0 160 L0 146" />
  </g>
</svg>
